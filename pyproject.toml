[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yacin MRINI", email = "yacin.mrini@berger-levrault.com" }
]
requires-python = ">=3.15"
dependencies = [
    "charset-normalizer>=3.5.2",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "sqlglot>=30.35.0",
]

[project.scripts]
indusense = "indusense:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
